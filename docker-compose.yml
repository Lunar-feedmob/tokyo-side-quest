# Local development services. Credentials below are local-only defaults;
# production uses its own managed values (see docs/deployment.md).
name: tokyo-side-quest

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: tsq
      POSTGRES_PASSWORD: tsq-local-password
      POSTGRES_DB: tsq
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsq -d tsq"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8.3-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (MinIO no longer publishes community images).
  storage:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - storagedata:/data
      - ./infra/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  redisdata:
  storagedata:
